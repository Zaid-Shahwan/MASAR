<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>MASAR — Sign In</title>

    <link rel="icon" type="image/png" href="assets/images/logo.png" />

    <!-- Main MASAR styles -->
    <link rel="stylesheet" href="css/style.css" />

    <!-- Authentication page styles -->
    <link rel="stylesheet" href="css/signin.css" />
  </head>

  <body>
    <main class="auth-page">
      <div class="auth-container">
        <!-- =========================
                 PETRA SIDE
            ========================== -->

        <section class="auth-visual">
          <!-- JoTrip Petra image -->
          <img
            src="assets/images/petra.jpg"
            alt="Petra Treasury in Jordan"
            class="auth-image"
          />

          <!-- Dark overlay -->
          <div class="auth-overlay"></div>

          <!-- Brand -->
          <a href="index.html" class="auth-brand">
            <img src="assets/images/MASAR_AI.png" alt="MASAR_AI" height="80" />
          </a>

          <!-- Text over image -->
          <div class="auth-visual-content">
            <span class="auth-label"> DISCOVER JORDAN </span>

            <h1>
              Your journey<br />
              starts here.
            </h1>

            <p>
              Explore Jordan, discover unforgettable places, and plan your
              perfect journey with MASAR.
            </p>
          </div>
        </section>

        <!-- =========================
                 FORM SIDE
            ========================== -->

        <section class="auth-form-side">
          <div class="auth-box">
            <!-- =========================
                         TABS
                    ========================== -->

            <div class="auth-tabs">
              <button type="button" class="auth-tab is-active" id="signInTab">
                Sign In
              </button>

              <button type="button" class="auth-tab" id="signUpTab">
                Sign Up
              </button>
            </div>

            <!-- =========================
                         SIGN IN PANEL
                    ========================== -->

            <div class="auth-panel is-active" id="signInPanel">
              <div class="auth-heading">
                <h2>Welcome back</h2>

                <p>Sign in to continue your journey.</p>
              </div>

              <div class="form-error" id="signInError"></div>

              <form id="signInForm">
                <div class="auth-field">
                  <label for="signInEmail"> Email </label>

                  <input
                    type="email"
                    id="signInEmail"
                    placeholder="you@example.com"
                    required
                  />
                </div>

                <div class="auth-field">
                  <label for="signInPassword"> Password </label>

                  <input
                    type="password"
                    id="signInPassword"
                    placeholder="••••••••"
                    required
                  />
                </div>

                <button type="submit" class="auth-button">Sign In</button>
              </form>
            </div>

            <!-- =========================
                         SIGN UP PANEL
                    ========================== -->

            <div class="auth-panel" id="signUpPanel">
              <div class="auth-heading">
                <h2>Create account</h2>

                <p>Start planning your Jordan adventure.</p>
              </div>

              <div class="form-error" id="signUpError"></div>

              <form id="signUpForm">
                <div class="auth-field">
                  <label for="signUpName"> Full Name </label>

                  <input
                    type="text"
                    id="signUpName"
                    placeholder="Your name"
                    required
                  />
                </div>

                <div class="auth-field">
                  <label for="signUpEmail"> Email </label>

                  <input
                    type="email"
                    id="signUpEmail"
                    placeholder="you@example.com"
                    required
                  />
                </div>

                <div class="auth-field">
                  <label for="signUpPassword"> Password </label>

                  <input
                    type="password"
                    id="signUpPassword"
                    placeholder="••••••••"
                    required
                  />
                </div>

                <div class="auth-field">
                  <label for="signUpConfirmPassword"> Confirm Password </label>

                  <input
                    type="password"
                    id="signUpConfirmPassword"
                    placeholder="••••••••"
                    required
                  />
                </div>

                <button type="submit" class="auth-button">
                  Create Account
                </button>
              </form>
            </div>
          </div>
        </section>
      </div>
    </main>

    <!-- Authentication JavaScript -->
    <script type="module" src="js/signin.js"></script>
  </body>
</html>
