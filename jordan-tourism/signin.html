<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MASAR — Sign In</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/signin.css">
</head>

<body>

    <main class="auth-page">

        <div class="auth-container">

            <!-- Left Side -->
            <section class="auth-info">
                <a href="index.html" class="auth-brand">MASAR</a>

                <div class="auth-info-content">
                    <span class="auth-label">DISCOVER JORDAN</span>

                    <h1>
                        Your journey<br>
                        starts here.
                    </h1>

                    <p>
                        Sign in or create an account to plan your
                        Jordanian adventure with MASAR.
                    </p>
                </div>
            </section>


            <!-- Right Side -->
            <section class="auth-card">

                <div class="auth-tabs">

                    <button type="button"
                            class="auth-tab is-active"
                            id="signInTab">
                        Sign In
                    </button>

                    <button type="button"
                            class="auth-tab"
                            id="signUpTab">
                        Sign Up
                    </button>

                </div>


                <!-- Sign In -->
                <div class="auth-panel is-active" id="signInPanel">

                    <div class="auth-heading">
                        <h2>Welcome back</h2>
                        <p>Sign in to continue your journey.</p>
                    </div>

                    <div class="form-error" id="signInError"></div>

                    <form id="signInForm">

                        <div class="auth-field">
                            <label for="signInEmail">Email</label>

                            <input type="email"
                                   id="signInEmail"
                                   placeholder="you@example.com"
                                   required>
                        </div>


                        <div class="auth-field">
                            <label for="signInPassword">Password</label>

                            <input type="password"
                                   id="signInPassword"
                                   placeholder="••••••••"
                                   required>
                        </div>


                        <button type="submit"
                                class="auth-button">
                            Sign In
                        </button>

                    </form>

                </div>


                <!-- Sign Up -->
                <div class="auth-panel" id="signUpPanel">

                    <div class="auth-heading">
                        <h2>Create account</h2>
                        <p>Start planning your Jordan adventure.</p>
                    </div>

                    <div class="form-error" id="signUpError"></div>

                    <form id="signUpForm">

                        <div class="auth-field">
                            <label for="signUpName">Full Name</label>

                            <input type="text"
                                   id="signUpName"
                                   placeholder="Your name"
                                   required>
                        </div>


                        <div class="auth-field">
                            <label for="signUpEmail">Email</label>

                            <input type="email"
                                   id="signUpEmail"
                                   placeholder="you@example.com"
                                   required>
                        </div>


                        <div class="auth-field">
                            <label for="signUpPassword">Password</label>

                            <input type="password"
                                   id="signUpPassword"
                                   placeholder="••••••••"
                                   required>
                        </div>


                        <div class="auth-field">
                            <label for="signUpConfirmPassword">
                                Confirm Password
                            </label>

                            <input type="password"
                                   id="signUpConfirmPassword"
                                   placeholder="••••••••"
                                   required>
                        </div>


                        <button type="submit"
                                class="auth-button">
                            Create Account
                        </button>

                    </form>

                </div>

            </section>

        </div>

    </main>

    <script src="js/signin.js"></script>

</body>
</html>
